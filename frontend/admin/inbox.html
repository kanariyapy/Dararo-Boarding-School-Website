<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Message inbox | Our School</title><link rel="stylesheet" href="/css/style.css"></head>
<body>
  <header class="site-header"><a class="brand" href="/">Our School admin</a><nav aria-label="Admin navigation"><a href="/">Public website</a><button id="logout-button" type="button" class="secondary">Sign out</button></nav></header>
  <main>
    <section class="hero"><div class="topline"><div><p class="eyebrow">Staff area</p><h1>Contact messages</h1></div><button id="refresh-button" type="button">Refresh</button></div><p id="inbox-status" class="status" role="status" aria-live="polite"></p></section>
    <section class="panel"><div class="table-wrap"><table><thead><tr><th>Status</th><th>Sender</th><th>Subject / message</th><th>Received</th><th>Actions</th></tr></thead><tbody id="messages-body"><tr><td colspan="5">Loading messages…</td></tr></tbody></table></div></section>
  </main>
  <script src="/js/inbox.js"></script>
</body>
</html>
