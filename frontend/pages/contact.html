<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us | Our School</title><link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header"><a class="brand" href="/">Our School</a><nav aria-label="Main navigation"><a href="/">Home</a><a href="/pages/about.html">About</a><a href="/pages/academics.html">Academics</a><a href="/pages/news.html">News</a><a href="/pages/contact.html">Contact</a><a class="admin-link" href="/admin/login.html">Staff login</a></nav></header>
  <main>
    <section class="panel form-panel">
      <h1>Contact us</h1>
      <p class="muted">Send a message to the school team. Do not include private student or medical information.</p>
      <form id="contact-form">
        <label for="name">Your name<input id="name" name="name" maxlength="100" required autocomplete="name"></label>
        <label for="email">Email address<input id="email" name="email" type="email" maxlength="254" required autocomplete="email"></label>
        <label for="subject">Subject<input id="subject" name="subject" maxlength="150" required></label>
        <label for="message">Message<textarea id="message" name="message" minlength="10" maxlength="5000" required></textarea></label>
        <div class="hidden" aria-hidden="true"><label for="website">Leave this field empty<input id="website" name="website" tabindex="-1" autocomplete="off"></label></div>
        <button type="submit">Send message</button>
        <p id="form-status" class="status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <footer class="site-footer"><p>&copy; <span id="year"></span> Our School</p></footer>
  <script src="/js/main.js"></script><script src="/js/contact.js"></script>
</body>
</html>
